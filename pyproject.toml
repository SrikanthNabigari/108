[project]
name = "one-zero-eight"
version = "2.0.0"
description = "Personal Life Operating System powered by Vedic Astrology"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Srikanth", email = "srikanthxnabigari@gmail.com" }
]
keywords = ["astrology", "vedic", "jyotish", "ai", "personal-assistant"]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "redis>=5.0.0",
    "pyswisseph>=2.10.0",
    "anthropic>=0.18.0",
    "langgraph>=0.0.30",
    "langchain-anthropic>=0.1.0",
    "mem0ai>=0.0.15",
    "mcp>=1.0.0",
    "temporalio>=1.4.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.18.3",
    "psycopg2-binary>=2.9.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.96.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pre-commit>=3.6.0",
    "ipython>=8.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/one_zero_eight"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.96.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pre-commit>=4.5.1",
    "pytest-cov>=7.0.0",
]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/cosmos",
    "packages/self",
    "packages/context",
    "packages/guide",
    "packages/memory",
]

[tool.uv.sources]
one-zero-eight-core = { workspace = true }
one-zero-eight-cosmos = { workspace = true }
one-zero-eight-self = { workspace = true }
one-zero-eight-context = { workspace = true }
one-zero-eight-guide = { workspace = true }
one-zero-eight-memory = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["core", "cosmos", "self_pkg", "context", "guide", "memory"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "swisseph.*",
    "mem0.*",
    "langgraph.*",
    "temporalio.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=packages",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "ephemeris: marks tests that require ephemeris data",
]

[tool.coverage.run]
source = ["packages"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
