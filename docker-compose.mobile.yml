# 108 Mobile Development Stack
# Usage: docker compose -f docker-compose.mobile.yml up -d
#
# This runs alongside Supabase CLI (supabase start).
# Supabase provides: Postgres (54322), Auth (54321), Realtime, Storage
# This compose provides: Gateway (8001), Redis (6380)
#
# Prerequisites:
#   brew install supabase/tap/supabase
#   supabase init && supabase start

services:
  # Redis for rate limiting and config cache
  redis-mobile:
    image: redis:7-alpine
    container_name: 108-redis-mobile
    ports:
      - "6380:6379"
    volumes:
      - redis_mobile_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Mobile API Gateway
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: 108-gateway
    ports:
      - "8001:8000"
    environment:
      - SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - REDIS_URL=redis://redis-mobile:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REVENUECAT_WEBHOOK_SECRET=${REVENUECAT_WEBHOOK_SECRET:-}
      - FCM_SERVER_KEY=${FCM_SERVER_KEY:-}
      - ENV=development
    depends_on:
      redis-mobile:
        condition: service_healthy
    volumes:
      - ./gateway:/app/gateway
      - ./packages:/app/packages
      - ./knowledge:/app/knowledge
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_mobile_data:

networks:
  default:
    name: 108-mobile-network
