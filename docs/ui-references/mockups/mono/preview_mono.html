<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>108 Mono Mockups</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:-apple-system,sans-serif;color:#e8e8e8;padding:40px}
h1{text-align:center;font-size:28px;font-weight:200;letter-spacing:6px;margin-bottom:6px}

.screen{display:flex;flex-direction:column;align-items:center;gap:10px}

<div class="screen"><span class="label">Chart</span><div class="frame"><img src="02_chart_mono.svg"/></div></div>
<div class="screen"><span class="label">Chat</span><div class="frame"><img src="03_chat_mono.svg"/></div></div>
<div class="screen"><span class="label">Timeline</span><div class="frame"><img src="04_timeline_mono.svg"/></div></div>
<div class="screen"><span class="label">Calendar</span><div class="frame"><img src="05_calendar_mono.svg"/></div></div>
</div></body></html>
