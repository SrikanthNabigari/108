[project]
name = "one-zero-eight-self"
version = "2.0.0"
description = "Pattern detection (yogas, doshas) for 108"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "one-zero-eight-core",
    "one-zero-eight-cosmos",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
