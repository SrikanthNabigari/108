[project]
name = "one-zero-eight-memory"
version = "2.0.0"
description = "Mem0 + LangMem integration for 108"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "one-zero-eight-core",
    "mem0ai>=0.0.15",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
