[project]
name = "one-zero-eight-core"
version = "2.0.0"
description = "Core shared types and utilities for 108"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
